[project]
name = "traffic-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.13",
    "tables>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "traffic"
