[project]
name = "traffic-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.13",
    "tables>=3.10",
]

[project.optional-dependencies]
neural = [
    "torch>=2.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "traffic"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF007"]

[tool.ruff.lint.per-file-ignores]
# Plot scripts choose the backend, and optional tests skip, before later imports.
"scripts/*.py" = ["E402"]
"tests/test_neural.py" = ["E402"]
"tests/test_identity.py" = ["E402"]
"tests/test_attention.py" = ["E402"]
